
services:
  fraud-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: financial-fraud-api

    ports:
      - "8000:8000"

    environment:
      MLFLOW_TRACKING_URI: "sqlite:////app/mlflow.db"
      MLFLOW_ARTIFACT_ROOT: "file:///D:/Financial_Fraud_MLOps/mlartifacts"
      POSTGRES_HOST: "financial-fraud-postgres"
      POSTGRES_PORT: "5432"
      KAFKA_BOOTSTRAP_SERVERS: "financial-fraud-kafka:19092"

    env_file:
      - ./docker/postgres/.env

    volumes:
      - type: bind
        source: ./mlflow.db
        target: /app/mlflow.db

      - type: bind
        source: ./mlartifacts
        target: /app/mlartifacts

      - type: bind
        source: ./artifacts
        target: /app/artifacts
        read_only: true

      # Feast registry and online database
      - type: bind
        source: ./feature_store/data
        target: /app/feature_store/data

    networks:
      - financial-fraud-network

    restart: unless-stopped

networks:
  financial-fraud-network:
    external: true
